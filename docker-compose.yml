version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: lumina-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: lumina-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/lumina_blog
    depends_on:
      - mongo

  frontend:
    build:
      context: ./Frontend/lumina-seperated
    container_name: lumina-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
